                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 document.getElementById(id).classList.add("hidden");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     document.getElementById(s).classList.remove("hidden");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     // BALANCE
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     function updateBalance(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       balance = Number(balance);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         balanceEl = document.getElementById("balance");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           walletEl = document.getElementById("walletBalance");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             balanceEl.innerText = balance;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               walletEl.innerText = balance;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 localStorage.setItem("balance", balance);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 // ACTIONS
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 function deposit(){ balance += 100; updateBalance(); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 function withdraw(){ balance -= 50; if(balance<0) balance=0; updateBalance(); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 function buy(){ balance -= 100; updateBalance(); tradeMsg.innerText="Bought BTC"; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 function sell(){ balance += 100; updateBalance(); tradeMsg.innerText="Sold BTC"; }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 // PRICE
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 function loadPrice(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     .then(r=>r.json())
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       .then(d=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           btcPrice.innerText = d.bitcoin.usd;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             // CHART
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             function loadChart(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               fetch("https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=7")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 .then(r=>r.json())
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   .then(d=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       let prices = d.prices.map(p=>p[1]);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           new Chart(chartCanvas,{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 type:"line",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       data:{labels:prices.map((_,i)=>i),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             datasets:[{data:prices,label:"BTC"}]}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   // LOGOUT
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   function logout(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     localStorage.clear();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       location.reload();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       // AUTO LOGIN
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       if(localStorage.getItem("user")) startApp();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </html>
